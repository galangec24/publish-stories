<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Stories from Filipino writers. Free columns, previews, and full stories unlocked with QR Ph." />
    <meta name="theme-color" content="#0e0b1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stories" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Abril+Fatface&family=Cinzel:wght@500;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Caveat:wght@500;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Publish Stories</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Safety net: if the app hasn't started after a few seconds (an old browser, or a stored
      // copy of the site with missing pieces), clear the stored copy once and reload; if it still
      // can't start, show a short message instead of a white page.
      ;(function () {
        function clearCopy() {
          var jobs = []
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister() }))
            }))
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k) }))
            }))
          }
          return Promise.all(jobs).catch(function () {})
        }
        window.__clearSiteCopy = clearCopy
        setTimeout(function () {
          if (window.__storiesStarted) return
          var tried = false
          try { tried = sessionStorage.getItem('start-retry') === '1' } catch (e) {}
          if (!tried) {
            try { sessionStorage.setItem('start-retry', '1') } catch (e) {}
            clearCopy().then(function () { location.reload() })
            return
          }
          document.getElementById('root').innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#444">' +
            '<h1 style="font-size:22px;margin:0 0 8px">Publish Stories couldn\'t start</h1>' +
            '<p style="margin:0 0 16px">Please update your browser (Safari, Chrome or Firefox), then try again.</p>' +
            '<button onclick="window.__clearSiteCopy().then(function(){location.reload()})" ' +
            'style="padding:10px 18px;border:0;border-radius:12px;background:#6a4ff0;color:#fff;font-size:15px">Reload</button></div>'
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
