# Render Blueprint: Django API + managed PostgreSQL.
# The React website (web/) is deployed separately to Firebase Hosting (web/firebase.json).
# FREE PLANS: the API sleeps when idle and the free database expires after 30 days.
# Before going live switch to plan: starter / basic-256mb and move migrate into preDeployCommand.
databases:
  - name: story-db
    plan: free
    region: singapore
    databaseName: story
    user: story

services:
  - type: web
    name: story-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free plans don't run preDeployCommand, so migrations run at start-up.
    startCommand: python manage.py migrate --noinput && python manage.py seed_genres && python manage.py ensure_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/genres/
    envVars:
      # First admin account (free plans have no shell for createsuperuser).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: story-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost  # the real *.onrender.com host is added automatically from RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        value: https://publish-stories-ph.web.app,https://publish-stories-ph.firebaseapp.com
      - key: FRONTEND_BASE_URL
        value: https://publish-stories-ph.web.app
      # Secrets: set these in the Render dashboard, never in this file.
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PAYMONGO_LIVE_MODE
        value: "False"
      # Add later in the Environment tab when needed (not prompted on first deploy):
      #   GOOGLE_DESKTOP_CLIENT_ID / GOOGLE_DESKTOP_CLIENT_SECRET  (Windows app sign-in)
      #   GS_BUCKET_NAME + GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/gcs.json  (cover images in Firebase Storage)
