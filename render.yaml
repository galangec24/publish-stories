# Render Blueprint: Django API. The PostgreSQL database is hosted on Supabase
# (paste its Session pooler connection string as DATABASE_URL when prompted).
# The React website (web/) is deployed separately to Firebase Hosting (web/firebase.json).
# FREE PLAN: the API sleeps when idle. Before going live switch to plan: starter
# and move migrate into preDeployCommand.
services:
  # Redis-compatible store that relays live events (notifications, support chat)
  # between server workers. Internal-only: no outside connections allowed.
  - type: keyvalue
    name: story-realtime
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: story-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free plans don't run preDeployCommand, so migrations run at start-up.
    startCommand: python manage.py migrate --noinput && python manage.py seed_genres && python manage.py ensure_admin && gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/genres/
    envVars:
      # First admin account (free plans have no shell for createsuperuser).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Supabase → Connect → Session pooler, with ?sslmode=require appended:
      # postgresql://postgres.<ref>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: story-realtime
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost  # the real *.onrender.com host is added automatically from RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        value: https://publish-stories-ph.web.app,https://publish-stories-ph.firebaseapp.com
      - key: FRONTEND_BASE_URL
        value: https://publish-stories-ph.web.app
      # Secrets: set these in the Render dashboard, never in this file.
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      # Live/test mode follows the PayMongo key (sk_live_ / sk_test_), so it isn't set here.
      - key: GIPHY_API_KEY
        sync: false
      # Chat attachments: Supabase → Project Settings → API (project URL + service_role key).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # AI reading and chapter reels (ai_media); each feature stays off until its key is set.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Add later in the Environment tab when needed (not prompted on first deploy):
      #   GOOGLE_DESKTOP_CLIENT_ID / GOOGLE_DESKTOP_CLIENT_SECRET  (Windows app sign-in)
      #   GS_BUCKET_NAME + GOOGLE_APPLICATION_CREDENTIALS=/etc/secrets/gcs.json  (cover images in Firebase Storage)
