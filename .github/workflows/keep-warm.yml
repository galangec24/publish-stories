name: Keep API awake

# Render's free plan puts the API to sleep after 15 idle minutes, and the next
# visitor waits about a minute for it to start. A light request every 10 minutes
# keeps it awake (one always-on service fits in the free 750 hours a month).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://story-api-gmpg.onrender.com/api/about/
